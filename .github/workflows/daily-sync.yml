name: Daily knowledge-base sync

on:
  schedule:
    # 02:17 UTC = 09:17 Asia/Ho_Chi_Minh (UTC+7)
    - cron: "17 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optibot-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout source code
      - name: Check out worker source
        uses: actions/checkout@v4

      # 2. Restore checkpoint from persistent branch
      - name: Restore durable checkpoint
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            refs/heads/sync-state:refs/remotes/origin/sync-state

          mkdir -p .sync-state

          git show origin/sync-state:sync-state.json \
            > .sync-state/sync-state.json

          test -s .sync-state/sync-state.json
          cp .sync-state/sync-state.json .sync-state/base-sync-state.json

          history_path=$(git ls-tree --name-only origin/sync-state -- failure-streaks.json)
          if [[ -n "$history_path" ]]; then
            git show origin/sync-state:failure-streaks.json \
              > .sync-state/failure-streaks.json
          else
            printf '{}\n' > .sync-state/failure-streaks.json
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          from app.checkpoint import read_checkpoint
          from tools.persist_sync_state import history

          read_checkpoint(Path('.sync-state/sync-state.json'))
          history(json.loads(Path('.sync-state/failure-streaks.json').read_text()))
          print('Checkpoint and failure history validated')
          PY

      # 3. FIX: Allow Docker worker (UID 10001) to write checkpoint
      - name: Grant worker access to checkpoint
        shell: bash
        run: |
          set -euo pipefail

          sudo chown -R 10001:10001 .sync-state

          ls -ld .sync-state
          ls -l .sync-state/sync-state.json

      # 4. Build Docker image
      - name: Build worker image
        run: |
          docker build \
            --tag optibot-sync:${{ github.sha }} \
            .

      # 5. Verify writable checkpoint before calling Gemini API
      - name: Verify checkpoint is writable
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$PWD/.sync-state:/state" \
            --entrypoint python \
            optibot-sync:${{ github.sha }} \
            -c '
          import tempfile
          from pathlib import Path

          state = Path("/state/sync-state.json")

          if not state.is_file():
              raise RuntimeError("Checkpoint file is missing")

          with tempfile.NamedTemporaryFile(
              dir="/state",
              prefix="sync-test-",
              suffix=".json",
              delete=True
          ) as test_file:
              test_file.write(b"{}")
              test_file.flush()

          print("Checkpoint is readable and directory is writable")
          '

      # 6. Run one-shot synchronization
      - name: Run one-shot synchronization
        id: worker
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE_NAME: ${{ secrets.GEMINI_FILE_SEARCH_STORE_NAME }}

        run: |
          set +e

          docker run --rm \
            --env GEMINI_API_KEY \
            --env GEMINI_FILE_SEARCH_STORE_NAME \
            --volume "$PWD/.sync-state:/state" \
            optibot-sync:${{ github.sha }} \
            --sync \
            --state-file /state/sync-state.json \
            --report-file /state/worker-report.json \
            2>&1 | tee daily-sync.log

          worker_exit=${PIPESTATUS[0]}

          echo "worker_exit=$worker_exit" >> "$GITHUB_OUTPUT"

          exit 0

      # 7. Persist verified articles even if another article failed.
      - name: Persist verified checkpoint and failure history
        id: persist
        if: steps.worker.outputs.worker_exit != ''
        shell: bash
        run: |
          set -euo pipefail

          test -s .sync-state/worker-report.json

          docker run --rm \
            --volume "$PWD/.sync-state:/state" \
            --entrypoint python \
            optibot-sync:${{ github.sha }} \
            tools/finalize_sync_report.py \
            --worker-report /state/worker-report.json \
            --prior-streaks /state/failure-streaks.json \
            --prepare-history \
            --output /state/next-failure-streaks.json

          python3 tools/persist_sync_state.py \
            --base .sync-state/base-sync-state.json \
            --local .sync-state/sync-state.json \
            --prior-history .sync-state/failure-streaks.json \
            --next-history .sync-state/next-failure-streaks.json

          echo 'persisted=true' >> "$GITHUB_OUTPUT"

      # 8. Report the business outcome after persistence is known.
      - name: Finalize sync report
        id: final
        if: always()
        shell: bash
        env:
          ALLOW_PARTIAL_SUCCESS: ${{ vars.ALLOW_PARTIAL_SUCCESS || 'false' }}
          MAX_FAILED_ARTICLES: ${{ vars.MAX_FAILED_ARTICLES || '1' }}
          MAX_FAILED_PERCENT: ${{ vars.MAX_FAILED_PERCENT || '1' }}
          MAX_CONSECUTIVE_FAILURES: ${{ vars.MAX_CONSECUTIVE_FAILURES || '2' }}
        run: |
          if [[ ! -s .sync-state/worker-report.json ]]; then
            echo '## Daily sync: FAILED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Worker did not produce a complete report.' >> "$GITHUB_STEP_SUMMARY"
            echo 'final_exit=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          args=(
            tools/finalize_sync_report.py
            --worker-report /state/worker-report.json
            --prior-streaks /state/failure-streaks.json
            --summary-file /state/step-summary.md
            --output /state/final-report.json
          )
          if [[ '${{ steps.persist.outputs.persisted }}' == 'true' ]]; then
            args+=(--checkpoint-persisted)
          fi

          set +e
          docker run --rm \
            --env ALLOW_PARTIAL_SUCCESS \
            --env MAX_FAILED_ARTICLES \
            --env MAX_FAILED_PERCENT \
            --env MAX_CONSECUTIVE_FAILURES \
            --volume "$PWD/.sync-state:/state" \
            --entrypoint python \
            optibot-sync:${{ github.sha }} \
            "${args[@]}"
          final_exit=$?
          set -e

          if [[ -s .sync-state/step-summary.md ]]; then
            cat .sync-state/step-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "final_exit=$final_exit" >> "$GITHUB_OUTPUT"
          exit 0

      # 9. Upload logs and JSON report even if synchronization fails.
      - name: Upload last-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sync-${{ github.run_id }}
          path: |
            daily-sync.log
            .sync-state/final-report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      # 10. Preserve the final policy decision, including persistence failures.
      - name: Preserve sync outcome
        if: always()
        shell: bash
        run: |
          final_exit="${{ steps.final.outputs.final_exit }}"
          if [[ -z "$final_exit" ]]; then
            echo "Final report did not produce an exit code" >&2
            exit 1
          fi
          exit "$final_exit"
